<div class="nuevo-alojamiento">
  <header>
    <h1>Nuevo Alojamiento</h1>
  </header>
  <form (ngSubmit)="guardarAlojamiento()">
    <div class="form-group">
      <label for="nombre">Nombre de la propiedad</label>
      <input id="nombre" name="nombre" type="text" placeholder="Ingrese el nombre de la propiedad" />
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" placeholder="Añade una breve descripción"></textarea>
    </div>
    <div class="form-group">
      <label for="capacidad">Capacidad</label>
      <input id="capacidad" name="capacidad" type="text" placeholder="Ejemplo: 2 habitaciones dobles + 1 habitación individual" />
    </div>
    <div class="form-group">
      <label for="imagen">URL de imagen</label>
      <input id="imagen" name="imagen" type="text" placeholder="Ingrese la URL de la imagen pública en internet" />
    </div>
    <div class="form-group">
      <label for="departamento">Departamento</label>
      <select id="departamento" name="departamento">
        <option value="">Seleccionar</option>
        <!-- Opciones dinámicas -->
      </select>
    </div>
    <div class="form-group">
      <label for="ciudad">Ciudad</label>
      <select id="ciudad" name="ciudad">
        <option value="">Seleccionar</option>
        <!-- Opciones dinámicas -->
      </select>
    </div>
    <div class="form-group">
      <label for="estado">Estado</label>
      <select id="estado" name="estado">
        <option value="">Seleccionar</option>
        <!-- Opciones dinámicas -->
      </select>
    </div>
    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input id="direccion" name="direccion" type="text" placeholder="Ejemplo: Avenida 9 - calle 12 #2 3" />
    </div>
    <div class="form-group">
      <label for="valor">Valor por día</label>
      <input id="valor" name="valor" type="text" placeholder="450.000" />
    </div>
    <button type="submit">Guardar</button>
  </form>
</div>
